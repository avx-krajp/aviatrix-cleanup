AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Aviatrix Cloud Cleanup — API + Web app + Cookie auth

Globals:
  Function:
    Runtime: python3.12
    Environment:
      Variables:
        CLEANUP_TABLE: !Ref CleanupJobsTable

# ── Parameters ────────────────────────────────────────────────────────────────
Parameters:
  StageName:
    Type: String
    Default: prod
  ResourcePrefix:
    Type: String
    Default: ""
    AllowedPattern: "^([a-z0-9]([a-z0-9-]{0,18}[a-z0-9])?-)?$"
    Description: >
      Optional prefix (including trailing hyphen, e.g. "alice-") prepended to
      every named resource so multiple people can deploy independent copies
      of this stack into the same AWS account without collisions. Leave
      blank for the canonical "aviatrix-cleanup" production stack.
  AzureSpSecretArn:
    Type: String
    Default: ""
    Description: >
      ARN of the Secrets Manager secret holding the Azure service principal as JSON
      {tenantId, clientId, clientSecret, subscriptionId}. Leave blank to disable Azure cleanup.
  GcpSaSecretArn:
    Type: String
    Default: ""
    Description: >
      ARN of the Secrets Manager secret holding the GCP service account key JSON.
      Leave blank to disable GCP cleanup.
  AzureSdkLayerArn:
    Type: String
    Default: ""
    Description: >
      ARN of your own pre-built Azure SDK Lambda layer (see docs/AZURE_LAYER.md
      for how to build one — it's pinned rather than built by this template
      because it sits close to the 250 MB Lambda layer limit). Leave blank to
      disable Azure cleanup/instances support.
  LoginPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: >
      Passphrase users type at /login.html. Min 12 chars. Pass via
      --parameter-overrides on first deploy. CFN keeps it across deploys.
  AuthSigningKey:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: >
      HMAC signing key for auth cookies. Generate with
      `openssl rand -hex 32`. Pass via --parameter-overrides on first deploy.
  ClaudeCodeCredsSecretArn:
    Type: String
    Default: ""
    Description: >
      ARN of the Secrets Manager secret holding Claude Code's credentials as
      JSON, used by Claude Code on the deploy runner. Either a direct API key
      ({"ANTHROPIC_API_KEY": "sk-ant-..."}) or Bedrock-routed credentials
      ({"CLAUDE_CODE_USE_BEDROCK": "1", "AWS_BEARER_TOKEN_BEDROCK": "...",
      "ANTHROPIC_DEFAULT_SONNET_MODEL": "...", "BEDROCK_REGION": "..."}).
      Leave blank to disable the Deploy feature.
  DeployRunnerAmiId:
    Type: String
    Default: ami-07a5b367e8dc8bd92
    Description: >
      AMI for the Deploy runner EC2 instance. Pinned explicitly (not resolved
      via the "latest Amazon Linux" SSM alias) because the runner is a
      stateful instance -- resolving "latest" on every deploy would silently
      terminate and recreate it (losing local state) whenever AWS publishes a
      newer AL2023 AMI, even on deploys that only touch Lambda code. Bump this
      deliberately when you want to roll the runner onto a newer AMI.

# ── Conditions ────────────────────────────────────────────────────────────────
Conditions:
  HasAzureSecret:      !Not [!Equals [!Ref AzureSpSecretArn,        ""]]
  HasGcpSecret:        !Not [!Equals [!Ref GcpSaSecretArn,          ""]]
  HasAzureLayer:       !Not [!Equals [!Ref AzureSdkLayerArn,        ""]]
  HasClaudeCodeCreds:  !Not [!Equals [!Ref ClaudeCodeCredsSecretArn, ""]]

# ══════════════════════════════════════════════════════════════════════════════
Resources:
# ══════════════════════════════════════════════════════════════════════════════

  # ── DynamoDB — job status store ─────────────────────────────────────────────
  CleanupJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ResourcePrefix}aviatrix-cleanup-jobs"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── DynamoDB — daily-stop schedule (single-row) ─────────────────────────────
  ScheduleTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ResourcePrefix}aviatrix-cleanup-schedule"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ── IAM — EventBridge Scheduler invokes the stop runner ─────────────────────
  SchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-stop-runner
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt StopRunnerFunction.Arn

  # ── Stop-runner Lambda — fired by EventBridge Scheduler ─────────────────────
  StopRunnerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ResourcePrefix}aviatrix-cleanup-stop-runner"
      Handler: schedule_runner.handler
      CodeUri: lambda/
      MemorySize: 256
      Timeout: 120
      Environment:
        Variables:
          SCHEDULE_TABLE:      !Ref ScheduleTable
          AZURE_SP_SECRET_ARN: !Ref AzureSpSecretArn
          GCP_SA_SECRET_ARN:   !Ref GcpSaSecretArn
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ScheduleTable
        - !If
          - HasAzureSecret
          - Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AzureSpSecretArn
          - !Ref AWS::NoValue
        - !If
          - HasGcpSecret
          - Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref GcpSaSecretArn
          - !Ref AWS::NoValue
        - Statement:
            - Effect: Allow
              Action:
                - ec2:DescribeInstances
                - ec2:DescribeRegions
                - ec2:DescribeImages
                - ec2:StopInstances
              Resource: "*"

  # ── HTTP API ────────────────────────────────────────────────────────────────
  CleanupApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowCredentials: false
      Auth:
        DefaultAuthorizer: CookieAuthorizer
        Authorizers:
          CookieAuthorizer:
            AuthorizerPayloadFormatVersion: '2.0'
            EnableSimpleResponses: true
            FunctionArn: !GetAtt AuthAuthorizerFunction.Arn
            Identity:
              Headers:
                - Cookie
            AuthorizerResultTtlInSeconds: 0

  # ── Login / Logout Lambda — open routes (no auth) ──────────────────────────
  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ResourcePrefix}aviatrix-cleanup-login"
      Handler: auth_login.handler
      CodeUri: lambda/
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          LOGIN_PASSWORD:    !Ref LoginPassword
          AUTH_SIGNING_KEY:  !Ref AuthSigningKey
          SESSION_TTL_SECS:  "28800"
      Events:
        Login:
          Type: HttpApi
          Properties:
            ApiId: !Ref CleanupApi
            Method: POST
            Path: /api/login
            Auth:
              Authorizer: NONE
        Logout:
          Type: HttpApi
          Properties:
            ApiId: !Ref CleanupApi
            Method: POST
            Path: /api/logout
            Auth:
              Authorizer: NONE

  # ── Lambda Authorizer — verifies cm_auth HMAC cookie ───────────────────────
  AuthAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ResourcePrefix}aviatrix-cleanup-authorizer"
      Handler: auth_authorizer.handler
      CodeUri: lambda/
      MemorySize: 128
      Timeout: 3
      Environment:
        Variables:
          AUTH_SIGNING_KEY: !Ref AuthSigningKey

  # SAM does not auto-create this when the authorizer is wired up via
  # FunctionArn (rather than inline). Without it API Gateway gets AccessDenied
  # invoking the authorizer and returns 500 Internal Server Error to clients.
  AuthAuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthAuthorizerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CleanupApi}/authorizers/*"

  # ── Routes Lambda — /api/cleanup*, /api/schedule*, /api/instances* ─────────
  CleanupRoutesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ResourcePrefix}aviatrix-cleanup-routes"
      Handler: cleanup_routes.handler
      CodeUri: lambda/
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          CLEANUP_WORKER_ARN:  !GetAtt CleanupWorkerFunction.Arn
          SCHEDULE_TABLE:      !Ref ScheduleTable
          STOP_RUNNER_ARN:     !GetAtt StopRunnerFunction.Arn
          SCHEDULER_ROLE_ARN:  !GetAtt SchedulerInvokeRole.Arn
          SCHEDULE_NAME:       !Sub "${ResourcePrefix}aviatrix-cleanup-stop-daily"
          AZURE_SP_SECRET_ARN: !Ref AzureSpSecretArn
          GCP_SA_SECRET_ARN:   !Ref GcpSaSecretArn
          DEPLOY_RUNNER_INSTANCE_ID: !If [HasClaudeCodeCreds, !Ref DeployRunnerInstance, ""]
          DEPLOY_ARTIFACTS_BUCKET:   !Ref DeployArtifactsBucket
          CLAUDE_CODE_CREDS_SECRET_ARN: !Ref ClaudeCodeCredsSecretArn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CleanupJobsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ScheduleTable
        - !If
          - HasAzureSecret
          - Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AzureSpSecretArn
          - !Ref AWS::NoValue
        - !If
          - HasGcpSecret
          - Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref GcpSaSecretArn
          - !Ref AWS::NoValue
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt CleanupWorkerFunction.Arn
            - Effect: Allow
              Action:
                - scheduler:CreateSchedule
                - scheduler:UpdateSchedule
                - scheduler:DeleteSchedule
                - scheduler:GetSchedule
              Resource: !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/${ResourcePrefix}aviatrix-cleanup-stop-daily"
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt SchedulerInvokeRole.Arn
            - Effect: Allow
              Action:
                - ec2:DescribeInstances
                - ec2:DescribeRegions
                - ec2:DescribeInstanceStatus
                - ec2:DescribeImages
                - ec2:StartInstances
                - ec2:StopInstances
              Resource: "*"
        - Statement:
            # ── Deploy feature — dispatch to the runner via SSM, read its logs ──
            - Effect: Allow
              Action:
                - ssm:SendCommand
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript"
                - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${DeployRunnerInstance}"
            - Effect: Allow
              Action:
                - ssm:GetCommandInvocation
              Resource: "*"
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "${DeployArtifactsBucket.Arn}/*"
      Events:
        StartCleanup:
          Type: HttpApi
          Properties:
            ApiId: !Ref CleanupApi
            Method: POST
            Path: /api/cleanup
            Auth:
              Authorizer: CookieAuthorizer
        GetStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref CleanupApi
            Method: GET
            Path: /api/cleanup/status
            Auth:
              Authorizer: CookieAuthorizer
        GetSchedule:
          Type: HttpApi
          Properties:
            ApiId: !Ref CleanupApi
            Method: GET
            Path: /api/schedule
            Auth:
              Authorizer: CookieAuthorizer
        PutSchedule:
          Type: HttpApi
          Properties:
            ApiId: !Ref CleanupApi
            Method: PUT
            Path: /api/schedule
            Auth:
              Authorizer: CookieAuthorizer
        SkipSchedule:
          Type: HttpApi
          Properties:
            ApiId: !Ref CleanupApi
            Method: POST
            Path: /api/schedule/skip
            Auth:
              Authorizer: CookieAuthorizer
        UnskipSchedule:
          Type: HttpApi
          Properties:
            ApiId: !Ref CleanupApi
            Method: POST
            Path: /api/schedule/unskip
            Auth:
              Authorizer: CookieAuthorizer
        GetInstances:
          Type: HttpApi
          Properties:
            ApiId: !Ref CleanupApi
            Method: GET
            Path: /api/instances
            Auth:
              Authorizer: CookieAuthorizer
        StartInstance:
          Type: HttpApi
          Properties:
            ApiId: !Ref CleanupApi
            Method: POST
            Path: /api/instances/start
            Auth:
              Authorizer: CookieAuthorizer
        StopInstance:
          Type: HttpApi
          Properties:
            ApiId: !Ref CleanupApi
            Method: POST
            Path: /api/instances/stop
            Auth:
              Authorizer: CookieAuthorizer
        StartAllInstances:
          Type: HttpApi
          Properties:
            ApiId: !Ref CleanupApi
            Method: POST
            Path: /api/instances/start-all
            Auth:
              Authorizer: CookieAuthorizer
        StopAllInstances:
          Type: HttpApi
          Properties:
            ApiId: !Ref CleanupApi
            Method: POST
            Path: /api/instances/stop-all
            Auth:
              Authorizer: CookieAuthorizer
        StartDeploy:
          Type: HttpApi
          Properties:
            ApiId: !Ref CleanupApi
            Method: POST
            Path: /api/deploy
            Auth:
              Authorizer: CookieAuthorizer
        GetDeployStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref CleanupApi
            Method: GET
            Path: /api/deploy/status
            Auth:
              Authorizer: CookieAuthorizer

  # ── Worker Lambda — long-running cleanup (30 AWS / 26 Azure / 14 GCP steps) ─
  # The Azure SDK layer is pinned via AzureSdkLayerArn — SAM never rebuilds it.
  # google-auth for GCP is bundled in the function zip via lambda/requirements.txt.
  CleanupWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ResourcePrefix}aviatrix-cleanup-worker"
      Handler: cleanup_worker.handler
      CodeUri: lambda/
      MemorySize: 1024
      Timeout: 900
      Layers: !If [HasAzureLayer, [!Ref AzureSdkLayerArn], !Ref "AWS::NoValue"]
      Environment:
        Variables:
          AZURE_SP_SECRET_ARN: !Ref AzureSpSecretArn
          GCP_SA_SECRET_ARN:   !Ref GcpSaSecretArn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CleanupJobsTable
        - !If
          - HasAzureSecret
          - Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AzureSpSecretArn
          - !Ref AWS::NoValue
        - !If
          - HasGcpSecret
          - Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref GcpSaSecretArn
          - !Ref AWS::NoValue
        - Statement:
            - Effect: Allow
              Action:
                # ── EC2 / VPC ──────────────────────────────────────────────────
                - ec2:Describe*
                - ec2:DeleteTransitGatewayVpcAttachment
                - ec2:DeleteTransitGateway
                - ec2:DeleteInstanceConnectEndpoint
                - ec2:DescribeInstanceConnectEndpoints
                - ec2:DeleteVpcPeeringConnection
                - ec2:DetachVpnGateway
                - ec2:DeleteVpnGateway
                - ec2:DeleteVpnConnection
                - ec2:DeleteVpc
                - ec2:DeleteSubnet
                - ec2:DeleteInternetGateway
                - ec2:DetachInternetGateway
                - ec2:DeleteRouteTable
                - ec2:DeleteRoute
                - ec2:DisassociateRouteTable
                - ec2:DeleteNetworkAcl
                - ec2:DeleteSecurityGroup
                - ec2:RevokeSecurityGroupIngress
                - ec2:RevokeSecurityGroupEgress
                - ec2:DeleteNetworkInterface
                - ec2:DetachNetworkInterface
                - ec2:DeleteVpcEndpoints
                - ec2:DeleteNatGateway
                - ec2:ReleaseAddress
                - ec2:TerminateInstances
                - ec2:ModifyInstanceAttribute
                - ec2:DeleteVolume
                - ec2:DeleteSnapshot
                - ec2:DeregisterImage
                - ec2:DeleteKeyPair
                # ── EKS ───────────────────────────────────────────────────────
                - eks:ListClusters
                - eks:DescribeCluster
                - eks:ListNodegroups
                - eks:DeleteNodegroup
                - eks:ListFargateProfiles
                - eks:DeleteFargateProfile
                - eks:DeleteCluster
                # ── Auto Scaling ──────────────────────────────────────────────
                - autoscaling:DescribeAutoScalingGroups
                - autoscaling:DeleteAutoScalingGroup
                # ── RDS ───────────────────────────────────────────────────────
                - rds:DescribeDBSubnetGroups
                - rds:DescribeDBClusters
                - rds:DescribeDBInstances
                - rds:DeleteDBCluster
                - rds:DeleteDBInstance
                - rds:DeleteDBSubnetGroup
                # ── ElastiCache ───────────────────────────────────────────────
                - elasticache:DescribeCacheSubnetGroups
                - elasticache:DescribeReplicationGroups
                - elasticache:DescribeCacheClusters
                - elasticache:DeleteReplicationGroup
                - elasticache:DeleteCacheCluster
                - elasticache:DeleteCacheSubnetGroup
                # ── EFS ───────────────────────────────────────────────────────
                - elasticfilesystem:DescribeFileSystems
                - elasticfilesystem:DescribeMountTargets
                - elasticfilesystem:DeleteMountTarget
                - elasticfilesystem:DeleteFileSystem
                # ── OpenSearch ────────────────────────────────────────────────
                - es:ListDomainNames
                - es:DescribeDomain
                - es:DeleteDomain
                - opensearch:ListDomainNames
                - opensearch:DescribeDomain
                - opensearch:DeleteDomain
                # ── MSK (Kafka) ───────────────────────────────────────────────
                - kafka:ListClustersV2
                - kafka:DescribeClusterV2
                - kafka:DeleteCluster
                # ── Redshift ──────────────────────────────────────────────────
                - redshift:DescribeClusters
                - redshift:DeleteCluster
                # ── ELB / ALB / NLB ──────────────────────────────────────────
                - elasticloadbalancing:DescribeLoadBalancers
                - elasticloadbalancing:DescribeListeners
                - elasticloadbalancing:DescribeTargetGroups
                - elasticloadbalancing:DeleteLoadBalancer
                - elasticloadbalancing:DeleteListener
                - elasticloadbalancing:DeleteTargetGroup
                # ── ECR ───────────────────────────────────────────────────────
                - ecr:DescribeRepositories
                - ecr:DeleteRepository

              Resource: "*"
        - Statement:
            # ── IAM — leftover spoke EC2 SSM role/profile only, never wildcard ──
            - Effect: Allow
              Action:
                - iam:GetRole
                - iam:DeleteRole
                - iam:ListAttachedRolePolicies
                - iam:DetachRolePolicy
              Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-spoke-ec2-ssm-role"
            - Effect: Allow
              Action:
                - iam:RemoveRoleFromInstanceProfile
                - iam:DeleteInstanceProfile
              Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/aws-spoke-ec2-ssm-profile"

  # ── Deploy feature — free-text request -> Claude Code -> Terraform apply ───
  # An isolated VPC + EC2 runner that a lab user can point at a plain-English
  # request (e.g. "stand up a controller + copilot in us-west-2"); Claude Code
  # on the runner interprets it and drives `terraform apply` against the
  # official Aviatrix control-plane module. Every resource here is tagged
  # csp-cost-ignore=yes so the cleanup tool itself never tears down its own
  # runner — see lambda/cleaners/base.py CSP_IGNORE_KEY/CSP_IGNORE_VALUE.
  DeployRunnerVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.99.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}aviatrix-cleanup-deploy-runner-vpc"
        - Key: csp-cost-ignore
          Value: "yes"

  DeployRunnerSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DeployRunnerVpc
      CidrBlock: 10.99.0.0/26
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}aviatrix-cleanup-deploy-runner-subnet"
        - Key: csp-cost-ignore
          Value: "yes"

  DeployRunnerIgw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}aviatrix-cleanup-deploy-runner-igw"
        - Key: csp-cost-ignore
          Value: "yes"

  DeployRunnerIgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref DeployRunnerVpc
      InternetGatewayId: !Ref DeployRunnerIgw

  DeployRunnerRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DeployRunnerVpc
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}aviatrix-cleanup-deploy-runner-rt"
        - Key: csp-cost-ignore
          Value: "yes"

  DeployRunnerRoute:
    Type: AWS::EC2::Route
    DependsOn: DeployRunnerIgwAttachment
    Properties:
      RouteTableId: !Ref DeployRunnerRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref DeployRunnerIgw

  DeployRunnerSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DeployRunnerSubnet
      RouteTableId: !Ref DeployRunnerRouteTable

  DeployRunnerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Deploy runner - outbound only (SSM Agent connects out; no inbound needed)"
      VpcId: !Ref DeployRunnerVpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}aviatrix-cleanup-deploy-runner-sg"
        - Key: csp-cost-ignore
          Value: "yes"

  DeployRunnerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: aviatrix-deploy-terraform
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:*
                  - elasticloadbalancing:*
                  - autoscaling:Describe*
                Resource: "*"
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:TagRole
                  - iam:CreatePolicy
                  - iam:DeletePolicy
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListPolicyVersions
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicyVersion
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:ListInstanceProfilesForRole
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:DeleteObject
                Resource:
                  - !GetAtt DeployArtifactsBucket.Arn
                  - !Sub "${DeployArtifactsBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                  - aws-marketplace:Subscribe
                  - aws-marketplace:ViewSubscriptions
                Resource: "*"
              - !If
                - HasClaudeCodeCreds
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref ClaudeCodeCredsSecretArn
                - !Ref AWS::NoValue

  DeployRunnerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref DeployRunnerRole

  DeployRunnerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      ImageId: !Ref DeployRunnerAmiId
      SubnetId: !Ref DeployRunnerSubnet
      SecurityGroupIds:
        - !Ref DeployRunnerSecurityGroup
      IamInstanceProfile: !Ref DeployRunnerInstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}aviatrix-cleanup-deploy-runner"
        - Key: csp-cost-ignore
          Value: "yes"
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -x
          exec > /var/log/aviatrix-deploy-bootstrap.log 2>&1

          # Swap — t2.micro only has 1 GB RAM, which is tight for Node/npm +
          # Terraform + Claude Code running concurrently.
          if [ ! -f /swapfile ]; then
            fallocate -l 2G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile swap swap defaults 0 0' >> /etc/fstab
          fi

          dnf install -y git jq nodejs npm unzip dnf-plugins-core

          dnf config-manager --add-repo https://rpm.releases.hashicorp.com/AmazonLinux/hashicorp.repo
          dnf install -y terraform

          npm install -g @anthropic-ai/claude-code

          # Claude Code refuses --dangerously-skip-permissions when running as
          # root (SSM Run Command's default user), so jobs run as this
          # unprivileged user instead.
          id deployrunner 2>/dev/null || useradd -m -s /bin/bash deployrunner

          mkdir -p /opt/aviatrix-deploy
          chown -R deployrunner:deployrunner /opt/aviatrix-deploy
          echo "bootstrap complete: $(date)" > /opt/aviatrix-deploy/BOOTSTRAP_OK

  # ── Deploy feature — Terraform state + SSM session log mirror ──────────────
  DeployArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ResourcePrefix}aviatrix-cleanup-deploy-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  # ── Web bucket — private; only CloudFront can read ─────────────────────────
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ResourcePrefix}aviatrix-cleanup-web-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ── Origin Access Control — modern equivalent of OAI ────────────────────────
  WebOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ResourcePrefix}aviatrix-cleanup-web-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── CloudFront Function — gates static files; redirects to /login.html ─────
  WebAuthFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${ResourcePrefix}aviatrix-cleanup-auth-check"
      AutoPublish: true
      FunctionConfig:
        Comment: Verify cm_auth HMAC; redirect to /login.html if missing/invalid
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        import crypto from 'crypto';

        var SIGNING_KEY = '${AuthSigningKey}';

        function handler(event) {
            var request = event.request;
            var uri = request.uri;

            // Public paths: login page itself, login/logout API, static assets
            // referenced from the login page (so the page can render before auth).
            if (uri === '/login.html' ||
                uri === '/logo.svg' ||
                uri.indexOf('/assets/') === 0 ||
                uri.indexOf('/api/login') === 0 ||
                uri.indexOf('/api/logout') === 0) {
                return request;
            }

            var auth = '';
            if (request.cookies && request.cookies['cm_auth']) {
                auth = request.cookies['cm_auth'].value;
            }

            if (!auth || !verify(auth)) {
                return {
                    statusCode: 302,
                    statusDescription: 'Found',
                    headers: {
                        'location':      { value: '/login.html?returnTo=' + encodeURIComponent(uri) },
                        'cache-control': { value: 'no-store' },
                    },
                };
            }
            return request;
        }

        function verify(token) {
            var dot = token.indexOf('.');
            if (dot < 1) return false;
            var payloadB64 = token.substring(0, dot);
            var sigB64     = token.substring(dot + 1);

            var expected = crypto.createHmac('sha256', SIGNING_KEY)
                .update(payloadB64)
                .digest('base64')
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=+$/, '');

            return expected === sigB64;
        }

  # ── CloudFront Distribution — single entry point ──────────────────────────
  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2
        Comment: Aviatrix Cloud Cleanup web app
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt WebOAC.Id
          - Id: ApiOrigin
            DomainName: !Sub "${CleanupApi}.execute-api.${AWS::Region}.amazonaws.com"
            OriginPath: !Sub "/${StageName}"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              HTTPSPort: 443
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WebAuthFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            # Managed-CachingDisabled
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # Managed-AllViewerExceptHostHeader (forwards Cookie etc.)
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  # ── Bucket policy: allow only this CloudFront distribution to read ─────────
  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${WebBucket}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}"

# ══════════════════════════════════════════════════════════════════════════════
Outputs:
# ══════════════════════════════════════════════════════════════════════════════

  WebUrl:
    Description: "Open this in a browser. Sign in with the LoginPassword."
    Value: !Sub "https://${WebDistribution.DomainName}"

  WebBucketName:
    Description: "Run: aws s3 sync ./web/ s3://<this>/"
    Value: !Ref WebBucket

  CloudFrontDistributionId:
    Description: "After uploading new files, invalidate cache: aws cloudfront create-invalidation --distribution-id <this> --paths '/*'"
    Value: !Ref WebDistribution

  CleanupApiUrl:
    Description: "Internal — for direct API access via curl (still requires the auth cookie now)"
    Value: !Sub "https://${CleanupApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"

  RoutesLambdaArn:
    Description: "Routes Lambda ARN"
    Value: !GetAtt CleanupRoutesFunction.Arn

  WorkerLambdaArn:
    Description: "Worker Lambda ARN"
    Value: !GetAtt CleanupWorkerFunction.Arn

  DynamoTableName:
    Description: "DynamoDB job table"
    Value: !Ref CleanupJobsTable

  DeployRunnerInstanceId:
    Description: "Deploy feature — runner EC2 instance ID (SSM managed target)"
    Value: !Ref DeployRunnerInstance

  DeployArtifactsBucketName:
    Description: "Deploy feature — Terraform state + session log bucket"
    Value: !Ref DeployArtifactsBucket
